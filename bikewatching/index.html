<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching — Boston BlueBikes | Shreya Bharathwajan</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
  </head>
  <body class="bikewatching-page">
    <header class="page-header">
      <div class="title-block">
        <p class="back-link"><a href="../projects/">← Projects</a></p>
        <h1>🚲 Bikewatching</h1>
      </div>
      <div class="time-filter">
        <div class="time-filter-row">
          <label for="time-slider">Filter by time:</label>
          <input
            id="time-slider"
            type="range"
            min="-1"
            max="1440"
            value="-1"
            step="1"
          />
        </div>
        <div class="time-readout">
          <time id="selected-time"></time>
          <em id="any-time">(any time)</em>
        </div>
      </div>
    </header>

    <section id="token-setup" class="token-setup" hidden>
      <h2>Mapbox setup (one time)</h2>
      <p>
        The map needs a free <strong>public</strong> token from
        <a href="https://account.mapbox.com/access-tokens/" target="_blank" rel="noopener noreferrer"
          >Mapbox</a
        >
        (sign up with your UCSD email). Paste it below — it is saved only in this browser.
      </p>
      <form id="token-form">
        <label class="token-label" for="token-input">
          Access token (<code>pk.</code>…)
          <input
            id="token-input"
            name="token"
            type="password"
            placeholder="pk.eyJ1Ijoi..."
            autocomplete="off"
            required
          />
        </label>
        <button type="submit">Save &amp; load map</button>
      </form>
    </section>

    <p id="map-status" class="map-status" aria-live="polite"></p>

    <div class="map-wrap">
      <div id="map">
        <svg></svg>
      </div>
    </div>

    <div class="legend" aria-label="Traffic flow legend">
      <span class="legend-heading">Legend:</span>
      <div class="legend-items">
        <div class="legend-item legend-departures">More departures</div>
        <div class="legend-item legend-balanced">Balanced</div>
        <div class="legend-item legend-arrivals">More arrivals</div>
      </div>
    </div>

    <script type="module" src="../global.js"></script>
    <script type="module" src="map.js"></script>
  </body>
</html>
