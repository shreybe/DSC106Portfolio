<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Shreya Bharathwajan</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav>
    <a href="../">Home</a>
    <a href="../projects/">Projects</a>
    <a href="./">Contact</a>
    <a href="../cv/">CV</a>
    <a href="https://github.com/shreybe" target="_blank" rel="noopener noreferrer">GitHub</a>
  </nav>
  <h1>Contact</h1>

  <!-- Do not use action="mailto:..." — Chrome flags it as an insecure form target. Same behavior via script. -->
  <form class="contact-form" id="contact-form" action="" method="get">
    <label>
      Email:
      <input type="email" name="email" required value="visitor@example.com" autocomplete="email">
    </label>
    <label>
      Subject:
      <input name="subject" required value="Hello from your portfolio site">
    </label>
    <label class="contact-field-body">
      Body:
      <textarea name="body" rows="3" cols="28" required>I wanted to reach out about…</textarea>
    </label>
    <button>Submit</button>
  </form>

  <script>
    (function () {
      const form = document.getElementById('contact-form');
      if (!form) return;

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        form.email.value = form.email.value.trim();
        form.subject.value = form.subject.value.trim();
        form.body.value = form.body.value.trim();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const email = form.email.value;
        const subject = form.subject.value;
        const body = form.body.value;

        const to = 'sbharathwajan@ucsd.edu';
        const params = new URLSearchParams();
        params.set('subject', subject);
        params.set('body', 'From: ' + email + '\n\n' + body);
        const link = document.createElement('a');
        link.href = 'mailto:' + to + '?' + params.toString();
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    })();
  </script>
</body>
</html>
