<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Shreya Bharathwajan</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Contact</h1>

  <!-- Do not use action="mailto:..." — Chrome flags it as an insecure form target. Same behavior via script. -->
  <form class="contact-form" id="contact-form" action="" method="get">
    <label>
      Email:
      <input type="email" name="email" required value="visitor@example.com" autocomplete="email">
    </label>
    <label>
      Subject:
      <input name="subject" required value="Hello from your portfolio site">
    </label>
    <label>
      Body:
      <textarea name="body" rows="3" cols="28" required>I wanted to reach out about…</textarea>
    </label>
    <button type="submit">Submit</button>
  </form>

  <script type="module" src="../global.js"></script>
</body>
</html>
