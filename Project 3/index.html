<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MODIS Wildfire Hotspots — Interactive Map (DSC 106)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/map-screen.css" />
  </head>
  <body>
    <section id="interactive" class="fullscreen-map" aria-label="Full-screen wildfire map">
      <header class="map-chrome-head">
        <span class="tag">MODIS · FIRMS hotspots</span>
        <span class="chrome-hint">Globe-style shading · scroll to zoom · drag to pan · click a spark</span>
      </header>
      <div class="controls">
        <div class="control">
          <strong>Acquisition date range</strong>
          <span id="date-label"></span>
          <input type="range" id="date-min" />
          <input type="range" id="date-max" />
        </div>
        <div class="control">
          <strong>Minimum confidence (%)</strong>
          <span id="conf-label"></span>
          <input type="range" id="confidence" min="0" max="100" step="5" value="0" />
        </div>
        <div class="control">
          <strong>Pass</strong>
          <div class="toggle-row">
            <button type="button" id="btn-day" class="active">Day</button>
            <button type="button" id="btn-night" class="active">Night</button>
          </div>
        </div>
        <div class="control">
          <strong>Reset</strong>
          <button type="button" id="btn-reset">Reset all filters</button>
        </div>
      </div>

      <div id="map-stats" class="map-stats-banner" role="status"></div>
      <div class="map-layout">
        <div id="map-wrap">
          <svg
            id="map-svg"
            viewBox="0 0 2800 1520"
            preserveAspectRatio="xMidYMid meet"
            aria-label="United States basemap for wildfire hotspots"
          ></svg>
          <canvas id="map-canvas" aria-hidden="true"></canvas>
        </div>
        <aside class="detail-panel" id="detail-panel">
          <h3>Details on demand</h3>
          <p class="detail-empty" id="detail-empty">Click a spark to inspect one hotspot.</p>
          <dl id="detail-dl" hidden></dl>
        </aside>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="js/fire-data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
